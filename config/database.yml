default: &default
  adapter: postgresql
  host:            <%= ENV["DEV_POSTGRES_HOST"] %>
  username:        <%= ENV["DEV_POSTGRES_USER"] %>
  password:        <%= ENV["DEV_POSTGRES_PASSWORD"] %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  encoding: unicode

development:
  <<: *default
  database: backlog_games_development

test:
  <<: *default
  database: backlog_games_test
